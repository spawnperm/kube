services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - '80:80'
      - '443:443'
      - '127.0.0.1:8080:8080'
    volumes:
      - ./dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
    networks:
      - cosmoport-net

  cosmoport:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cosmoport
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - '3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - cosmoport-net

networks:
  cosmoport-net:
    driver: bridge
