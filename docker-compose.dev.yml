version: '3.8'

services:
  cosmoport-dev:
    image: node:22-alpine
    container_name: cosmoport-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
